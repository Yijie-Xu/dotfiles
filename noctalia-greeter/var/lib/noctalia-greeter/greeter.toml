[session]
default = "Niri"

[appearance]
scheme = "Synced"
password_style = "default"
hide_logo = true

[clock]
enabled = true
position = "above-panel"
time_format = "{:%H:%M}"
date_format = "%A, %x"

[output]
use_synced_settings = true
width = 1920
height = 1200

[auth]
allow_empty_password = false
request_timeout = 60
